<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storybooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Домашний экран: плитки сторибуков.

   Список собирается из двух мест — brands/index.json (папки на диске) и
   хранилища браузера (пакеты). Обложка плитки — цвета из tokens.css самой
   системы: список одинаковых серых карточек не даёт узнать свою систему в
   лицо, а палитра даёт.

   Собственные значения цвета: этот экран открывается до того, как выбран
   какой-либо бренд, и зависеть от его токенов не может.
   ========================================================================== */
:root {
  --bg:           #FBFCFD;
  --surface:      #FFFFFF;
  --border:       #E3E8F0;
  --text:         #1A1A1A;
  --muted:        #757575;
  --radius:       12px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 48px 40px 96px;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px;
}
main { max-width: 1120px; margin: 0 auto; }

.head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; }
.head p { margin: 0; font-size: 13px; color: var(--muted); }

.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}

.card {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
  transition: border-color .15s ease, transform .15s ease;
}
.card:hover { border-color: var(--text); }

/* Обложка: полосы токенов системы. Пока токены не прочитаны — ровный фон,
   без скелетонов: карточка и так появляется мгновенно. */
.cover { display: flex; height: 96px; background: #F3F5F8; }
.cover i { flex: 1 1 0; }

.body { padding: 12px 14px 14px; }
.name { font-size: 13px; font-weight: 600; }
.meta { margin-top: 3px; font-size: 11px; color: var(--muted); }

.badge {
  display: inline-block; padding: 0 6px; border-radius: 20px;
  border: 1px solid var(--border); font-size: 10px; font-weight: 600;
  color: var(--muted);
}

/* Плитка создания стоит в том же ряду: заводить систему — такое же
   обычное действие, как открыть существующую. */
.card--new {
  display: grid; place-items: center; min-height: 168px;
  border-style: dashed; color: var(--muted);
  font-size: 13px; font-weight: 600;
}
.card--new:hover { color: var(--text); }

/* Главное сообщение экрана: кто читает сторибук и кто его наполняет.
   Техника (сервер, адреса) — вторым планом, мельче. */
.lead { max-width: 720px; margin: 0 0 32px; font-size: 13px; color: var(--text); }
.lead small { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
.lead code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1 id="title">Storybooks</h1>
    <p id="sub"></p>
  </div>

  <p class="lead" id="hint"></p>

  <div class="grid" id="grid"></div>
</main>

<script src="packages/engine/i18n/en.js"></script>
<script src="packages/engine/i18n/ru.js"></script>
<script>
(function () {
  'use strict';

  /* Язык — общая настройка воркспейса, та же, что в галерее. Читаем её
     напрямую: тащить сюда весь резолвер бренда ради одной строки незачем. */
  function locale() {
    try {
      var s = JSON.parse(localStorage.getItem('ds:settings') || '{}');
      if (s.locale) return s.locale;
    } catch (e) {}
    return (navigator.language || 'en').indexOf('ru') === 0 ? 'ru' : 'en';
  }
  var LOC = locale();
  function t(key, vars) {
    var packs = window.ENGINE_I18N || {};
    var s = (packs[LOC] && packs[LOC][key]);
    if (s === undefined) s = (packs.en && packs.en[key]);
    if (s === undefined) return key;
    return vars ? s.replace(/\{(\w+)\}/g, function (m, n) {
      return vars[n] !== undefined ? vars[n] : m;
    }) : s;
  }

  document.getElementById('title').textContent = t('home.title');
  document.getElementById('hint').innerHTML = t('home.hint');

  var grid = document.getElementById('grid');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* До пяти цветов из токенов — этого хватает, чтобы систему узнавали.
     Берём объявления подряд: первые в файле обычно и есть брендовые. */
  function coverFrom(css) {
    var colors = [];
    var re = /--[\w-]+\s*:\s*(#[0-9a-fA-F]{3,8})\s*;/g, m;
    while ((m = re.exec(css)) && colors.length < 5) colors.push(m[1]);
    return colors;
  }

  /* Сколько внутри. Это и есть ответ на вопрос «что за система»: пустой
     каркас и рабочая библиотека выглядят одинаково, пока не сказано,
     сколько в них токенов и компонентов. */
  function countTokens(css) {
    /* Комментарии вырезаем: в них полно примеров вида «--r-md: 24px», и
       без этого SDM показывал 226 токенов вместо 196. */
    var body = String(css || '').replace(/\/\*[\s\S]*?\*\//g, '');
    var names = {};
    var re = /(--[\w-]+)\s*:/g, m;
    while ((m = re.exec(body))) names[m[1]] = 1;
    return Object.keys(names).length;
  }

  /* Форма слова по числу. Английскому хватает двух, русскому нужно три —
     «1 токен · 2 токена · 5 токенов». Писать «1 components» в продукте,
     который сам про типографику, неловко. */
  function plural(base, n) {
    var suffix;
    if (LOC === 'ru') {
      var d10 = n % 10, d100 = n % 100;
      if (d10 === 1 && d100 !== 11) suffix = '.one';
      else if (d10 >= 2 && d10 <= 4 && (d100 < 10 || d100 >= 20)) suffix = '.few';
      else suffix = '.many';
    } else {
      suffix = n === 1 ? '.one' : '.many';
    }
    return t(base + suffix, { n: n });
  }

  function summary(tokens, components) {
    var parts = [];
    if (tokens) parts.push(plural('home.tokens', tokens));
    if (components) parts.push(plural('home.components', components));
    return parts.length ? parts.join(' · ') : t('home.emptyCard');
  }

  function paintCover(card, colors) {
    var cover = card.querySelector('.cover');
    if (!colors.length) return;
    cover.innerHTML = '';
    colors.forEach(function (c) {
      var band = el('i');
      band.style.background = c;
      cover.appendChild(band);
    });
  }

  function card(suite) {
    var a = el('a', 'card');
    a.href = suite.href;
    a.appendChild(el('div', 'cover'));
    var body = el('div', 'body');
    body.appendChild(el('div', 'name', suite.title));
    /* Строка под именем: что внутри. Бейдж — только пакетам: «папка на
       диске» это норма, и подписывать ею каждую карточку значит писать
       одно слово под всеми; а «живёт только в этом браузере» —
       предупреждение, и его видно должно быть сразу. */
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'js-summary', '…'));
    if (suite.origin !== 'library') {
      meta.appendChild(document.createTextNode(' '));
      meta.appendChild(el('span', 'badge', t('badge.browserOnly')));
    }
    body.appendChild(meta);
    a.appendChild(body);
    grid.appendChild(a);
    return a;
  }

  /* Папки на диске: список объявлен репозиторием, потому что браузер не
     умеет читать содержимое каталога. */
  function library() {
    return fetch('brands/index.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { brands: [] }; })
      .catch(function () { return { brands: [] }; })
      .then(function (data) {
        var hidden = [];
        try { hidden = JSON.parse(localStorage.getItem('ds:hidden') || '[]'); } catch (e) {}
        return (data.brands || [])
          .filter(function (b) { return hidden.indexOf(b.id) < 0; })
          .map(function (b) {
            return { id: b.id, title: b.title || b.id, origin: 'library',
                     href: '/' + b.id,
                     tokens: b.path + '/tokens.css',
                     sections: b.path + '/sections.json' };
          });
      });
  }

  /* Пакеты в браузере: обложку берём из самого пакета, запросов не нужно. */
  function local() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('ds:local') || '[]'); } catch (e) {}
    return list.map(function (rec) {
      var css = '', components = 0;
      try {
        var pack = JSON.parse(localStorage.getItem('ds:bundle:' + rec.id) || 'null');
        var m = pack && JSON.parse(pack.files['manifest.json']);
        css = (pack && m && pack.files[m.css.tokens]) || '';
        var sections = pack && JSON.parse(pack.files[m.sections || 'sections.json'] || '[]');
        components = Array.isArray(sections) ? sections.length : 0;
      } catch (e) {}
      return { id: rec.id, title: rec.title || rec.id, origin: 'local',
               href: 'packages/engine/gallery.html?suite=' + encodeURIComponent(rec.id),
               css: css, components: components };
    });
  }

  Promise.all([library(), Promise.resolve(local())]).then(function (parts) {
    var suites = parts[0].concat(parts[1]);

    document.getElementById('sub').textContent =
      suites.length ? t('home.count', { n: suites.length }) : t('home.empty');

    suites.forEach(function (suite) {
      var node = card(suite);
      var line = node.querySelector('.js-summary');

      if (suite.css != null) {
        paintCover(node, coverFrom(suite.css));
        line.textContent = summary(countTokens(suite.css), suite.components || 0);
        return;
      }

      Promise.all([
        fetch(suite.tokens, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
        fetch(suite.sections, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
      ]).then(function (parts) {
        paintCover(node, coverFrom(parts[0]));
        line.textContent = summary(countTokens(parts[0]),
                                   Array.isArray(parts[1]) ? parts[1].length : 0);
      });
    });

    var add = el('a', 'card card--new', t('home.new'));
    add.href = '/new';
    grid.appendChild(add);
  });
})();
</script>
</body>
</html>
