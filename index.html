<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeLibra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Home — workspace index of Libras (design-system instances).

   Layout from Figma frame «home»: DeLibra header, tagline row, card grid.
   ========================================================================== */
:root {
  --bg:           #FBFCFD;
  --surface:      #FFFFFF;
  --border:       #E3E8F0;
  --text:         #1A1A1A;
  --muted:        #757575;
  --radius:       12px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 48px 40px 96px;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px;
}
main { max-width: 1120px; margin: 0 auto; }

.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; min-height: 36px;
}
.brand {
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.brand svg { flex: none; width: auto; height: 24px; color: var(--text); }
.brand h1 {
  margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2;
  letter-spacing: -0.02em; color: var(--text);
}

.btn-new {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  height: 32px; padding: 0 12px;
  border: 1px solid transparent; border-radius: 16px;
  background: #333333; color: #fff;
  font: 500 12px/1 var(--font); text-decoration: none;
  transition: background-color .12s ease;
}
.btn-new:hover { background: #000; }

.intro {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; padding-top: 32px;
}
.tagline {
  margin: 0; max-width: 560px;
  font-size: 13px; font-weight: 400; line-height: 1.25; color: var(--text);
}
.tagline a { color: inherit; }
.tagline a:hover { text-decoration: none; opacity: .72; }
.count {
  margin: 0; flex: none;
  font-size: 13px; color: var(--muted); white-space: nowrap;
}

.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  padding-top: 32px;
}

.card {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
  transition: border-color .15s ease;
}
.card:hover { border-color: var(--text); }

.cover { display: flex; height: 96px; background: #F3F5F8; }
.cover i { flex: 1 1 0; }

.body { padding: 12px 14px 14px; }
.name { font-size: 13px; font-weight: 600; line-height: 1.25; }
.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
  margin-top: 4px; font-size: 11px; color: var(--muted); line-height: 1.25;
}
.meta:empty { display: none; }
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 20px;
  border: 1px solid var(--border); font-size: 10px; font-weight: 600;
  color: var(--muted);
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 38 36" fill="currentColor" aria-hidden="true">
        <path d="M0 0H1.60938V36H0V0Z"/>
        <path d="M6.55859 0H8.6941V36H6.55859V0Z"/>
        <path d="M11.793 0H15.5171V36H11.793V0Z"/>
        <path d="M18 0H23.8242V36H18V0Z"/>
        <mask id="dl-home-mask" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="11" y="0" width="27" height="36">
          <path d="M37.8619 18C37.8619 27.9411 32.0262 36 24.8275 36C17.6287 36 11.793 27.9411 11.793 18C11.793 8.05887 17.6287 0 24.8275 0C32.0262 0 37.8619 8.05887 37.8619 18Z" fill="#fff"/>
        </mask>
        <g mask="url(#dl-home-mask)">
          <path d="M25.4531 -3.10156H39.729V37.864H25.4531V-3.10156Z"/>
        </g>
      </svg>
      <h1 id="product-name">DeLibra</h1>
    </div>
    <a class="btn-new" id="new-btn" href="/new">New libra</a>
  </header>

  <div class="intro">
    <p class="tagline" id="tagline"></p>
    <p class="count" id="count"></p>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script src="packages/engine/i18n/en.js"></script>
<script src="packages/engine/i18n/ru.js"></script>
<script>
(function () {
  'use strict';

  function locale() {
    try {
      var s = JSON.parse(localStorage.getItem('ds:settings') || '{}');
      if (s.locale) return s.locale;
    } catch (e) {}
    return (navigator.language || 'en').indexOf('ru') === 0 ? 'ru' : 'en';
  }
  var LOC = locale();
  function t(key, vars) {
    var packs = window.ENGINE_I18N || {};
    var s = (packs[LOC] && packs[LOC][key]);
    if (s === undefined) s = (packs.en && packs.en[key]);
    if (s === undefined) return key;
    return vars ? s.replace(/\{(\w+)\}/g, function (m, n) {
      return vars[n] !== undefined ? vars[n] : m;
    }) : s;
  }

  document.title = t('product.name');
  document.getElementById('product-name').textContent = t('product.name');
  document.getElementById('new-btn').textContent = t('home.new');
  document.getElementById('tagline').innerHTML =
    t('home.tagline') + ' <a href="README.md">' + t('home.docsLink') + '</a>.';

  var grid = document.getElementById('grid');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function coverFrom(css) {
    var colors = [];
    var re = /--[\w-]+\s*:\s*(#[0-9a-fA-F]{3,8})\s*;/g, m;
    while ((m = re.exec(css)) && colors.length < 5) colors.push(m[1]);
    return colors;
  }

  function countTokens(css) {
    var body = String(css || '').replace(/\/\*[\s\S]*?\*\//g, '');
    var names = {};
    var re = /(--[\w-]+)\s*:/g, m;
    while ((m = re.exec(body))) names[m[1]] = 1;
    return Object.keys(names).length;
  }

  function plural(base, n) {
    var suffix;
    if (LOC === 'ru') {
      var d10 = n % 10, d100 = n % 100;
      if (d10 === 1 && d100 !== 11) suffix = '.one';
      else if (d10 >= 2 && d10 <= 4 && (d100 < 10 || d100 >= 20)) suffix = '.few';
      else suffix = '.many';
    } else {
      suffix = n === 1 ? '.one' : '.many';
    }
    return t(base + suffix, { n: n });
  }

  function summary(tokens, components) {
    var parts = [];
    if (tokens) parts.push(plural('home.tokens', tokens));
    if (components) parts.push(plural('home.components', components));
    return parts.join(' · ');
  }

  function setStats(metaEl, tokens, components) {
    var text = summary(tokens, components);
    metaEl.textContent = '';
    if (!text) {
      metaEl.appendChild(el('span', null, t('home.emptyCard')));
      return;
    }
    metaEl.appendChild(el('span', null, text));
  }

  function paintCover(card, colors) {
    var cover = card.querySelector('.cover');
    if (!colors.length) return;
    cover.innerHTML = '';
    colors.forEach(function (c) {
      var band = el('i');
      band.style.background = c;
      cover.appendChild(band);
    });
  }

  function card(suite) {
    var a = el('a', 'card');
    a.href = suite.href;
    a.appendChild(el('div', 'cover'));
    var body = el('div', 'body');
    body.appendChild(el('div', 'name', suite.title));
    var meta = el('div', 'meta');
    if (suite.origin !== 'library') {
      meta.appendChild(el('span', 'badge', t('badge.browserOnly')));
    }
    body.appendChild(meta);
    a.appendChild(body);
    grid.appendChild(a);
    return a;
  }

  function library() {
    function mapBrand(b, urls) {
      return { id: b.id, title: b.title || b.id, origin: 'library',
               href: '/' + b.id,
               tokens: urls.tokens,
               sections: urls.sections };
    }

    function urlsFor(id) {
      return {
        tokens: '/__data/' + id + '/tokens.css',
        sections: '/__data/' + id + '/sections.json'
      };
    }

    return fetch('/__api/brands', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        if (!data) {
          return fetch('brands/index.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : { brands: [] }; })
            .catch(function () { return { brands: [] }; });
        }
        return data;
      })
      .then(function (data) {
        var hidden = [];
        try { hidden = JSON.parse(localStorage.getItem('ds:hidden') || '[]'); } catch (e) {}
        return (data.brands || [])
          .filter(function (b) { return hidden.indexOf(b.id) < 0; })
          .map(function (b) {
            var urls = b.path
              ? {
                tokens: '/' + b.path + '/tokens.css',
                sections: '/' + b.path + '/sections.json'
              }
              : urlsFor(b.id);
            return mapBrand(b, urls);
          });
      });
  }

  function local() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('ds:local') || '[]'); } catch (e) {}
    return list.map(function (rec) {
      var css = '', components = 0;
      try {
        var pack = JSON.parse(localStorage.getItem('ds:bundle:' + rec.id) || 'null');
        var m = pack && JSON.parse(pack.files['manifest.json']);
        css = (pack && m && pack.files[m.css.tokens]) || '';
        var sections = pack && JSON.parse(pack.files[m.sections || 'sections.json'] || '[]');
        components = Array.isArray(sections) ? sections.length : 0;
      } catch (e) {}
      return { id: rec.id, title: rec.title || rec.id, origin: 'local',
               href: 'packages/engine/gallery.html?suite=' + encodeURIComponent(rec.id),
               css: css, components: components };
    });
  }

  Promise.all([library(), Promise.resolve(local())]).then(function (parts) {
    var suites = parts[0].concat(parts[1]);

    document.getElementById('count').textContent =
      suites.length ? t('home.count', { n: suites.length }) : t('home.empty');

    suites.forEach(function (suite) {
      var node = card(suite);
      var meta = node.querySelector('.meta');
      var badge = meta.querySelector('.badge');

      function finish(tokens, components) {
        setStats(meta, tokens, components);
        if (badge) meta.appendChild(badge);
      }

      if (suite.css != null) {
        paintCover(node, coverFrom(suite.css));
        finish(countTokens(suite.css), suite.components || 0);
        return;
      }

      Promise.all([
        fetch(suite.tokens, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
        fetch(suite.sections, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
      ]).then(function (parts) {
        paintCover(node, coverFrom(parts[0]));
        finish(countTokens(parts[0]), Array.isArray(parts[1]) ? parts[1].length : 0);
      });
    });
  });
})();
</script>
</body>
</html>
