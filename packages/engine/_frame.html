<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>preview frame</title>
<!-- Brand font and stylesheets come from the manifest: the engine does not know
     which brand it shows. See brand.js — paths resolve from the brand folder. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var brand = q.get('brand');
  /* Without a folder path the frame loads nothing: package styles arrive via
     g:brandcss from the gallery. */
  if (!brand) return;
  var base = new URL(brand.replace(/\/+$/, '') + '/', location.href).pathname;

  /* <base> is the key split detail: brand markup uses paths like
     assets/icons/x.svg, but the frame lives in the engine folder. Without base
     they would resolve under packages/engine and 404 every icon. */
  var b = document.createElement('base');
  b.href = base;
  document.head.appendChild(b);
  var bust = q.get('v') ? ('?v=' + encodeURIComponent(q.get('v'))) : '';

  function link(id, href, disabled) {
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.id = id;
    l.href = /^https?:/.test(href) ? href : base + href + bust;
    if (disabled) l.disabled = true;
    document.head.appendChild(l);
    return l;
  }

  /* Read manifest synchronously: stylesheets must load before the first g:render.
     Read, do not execute — the frame runs nothing from the brand. Legacy manifest.js
     remains while brands migrate; only it requires eval. */
  function read(file) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', base + file + bust, false);
    try { xhr.send(); } catch (e) { return null; }
    if (xhr.status && xhr.status >= 400) return null;
    return xhr.responseText;
  }

  var json = read('manifest.json');
  if (json) {
    try { window.BRAND_MANIFEST = JSON.parse(json); } catch (e) { return; }
  } else {
    var legacy = read('manifest.js');
    if (!legacy) return;
    (0, eval)(legacy);
  }

  var m = window.BRAND_MANIFEST || {};
  window.BRAND_BASE = base;
  if (m.preview && m.preview.container) {
    document.documentElement.style.setProperty('--g-container', m.preview.container + 'px');
  }
  if (m.font && m.font.href) link('brand-font', m.font.href);
  if (m.css && m.css.tokens)     link('css-new-tokens', m.css.tokens);
  if (m.css && m.css.components) link('css-brand',      m.css.components);
  // Comparing with foreign CSS is optional: the brand may omit it.
  if (m.compare && m.compare.legacy) link('css-current', m.compare.legacy, true);
})();
</script>
<style>
  /* Sandbox chrome. None of this participates in inspection —
     all rules are in layer g-chrome and filtered out. */
  @layer g-chrome {
    html, body { margin: 0; }
    body { background: transparent; overflow-x: hidden; }
    /* #root mirrors brand container width: min(--g-container, 100% − 40) on desktop
       and 100% − 32 on mobile — otherwise the card grid gives wrong column width.
       Value from manifest; default for brands that said nothing about preview.
       Do NOT center: in the gallery content is flush left so mobile and desktop
       versions share one vertical and can be compared line by line. On the site
       the container stays centered. */
    #root { width: min(var(--g-container, 1170px), 100% - 40px); margin-inline: 0;
            padding: 16px 0 16px 16px;
            /* content-box: 16px padding adds OUTSIDE container width.
               With border-box it ate width and the 3-column grid gave 374px instead of 379.33.
               !important because this rule is in @layer while brand
               `* { box-sizing: border-box }` is unlayered — unlayered wins. */
            box-sizing: content-box !important; }
    @media (max-width: 900px) { #root { width: calc(100% - 32px); } }
    /* Sections full-bleed on the site (hero, scroll strips) must not get sandbox
       gutter on top of their own padding — otherwise content is half as wide. */
    .g-bleed { margin-inline: calc(var(--gutter, 16px) * -1); }

    /* Full-width sections (hero) in the gallery shown as a component: rounded frame
       and left inset, not flush to the sandbox edge. */
    .g-inset { border-radius: 24px; overflow: hidden; }

    /* "Label + sample" row — ONE grid for both breakpoints: fixed metadata column
       and component column. No media queries: otherwise labels in mobile and desktop
       panels misalign and cannot be compared line by line. */
    .g-row {
      display: grid;
      /* Metadata column width is fixed: var(--g-meta-w) used to sit here but no
         brand declared it — fallback always ran and the variable misled. */
      grid-template-columns: 180px 1fr;
      align-items: center;
      column-gap: 16px;
      margin-bottom: 14px;
    }
    .g-row__meta { min-width: 0; }
    .g-row__name { font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--text-heading); }
    .g-row__cls  { font-family: ui-monospace, Menlo, monospace; font-size: 10px; line-height: 1.4;
                   color: var(--text-muted); }
    .g-row__meta-val { font-size: 10px; line-height: 1.4; color: var(--text-muted); }
    .g-row__sample { min-width: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .g-pick { cursor: pointer; }
    .g-pick:hover {
      outline: 2px solid var(--blue-accent, #0094FF);
      outline-offset: 4px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  var qs = new URLSearchParams(location.search);
  var root = document.getElementById('root');

  // same cache-buster as the gallery: otherwise the frame draws stale CSS
  var t = qs.get('t');
  if (t) {
    ['css-new-tokens', 'css-brand', 'css-current'].forEach(function (id) {
      var l = document.getElementById(id);
      if (l && l.getAttribute('href').indexOf('?') < 0) l.href = l.getAttribute('href') + '?t=' + t;
    });
  }

  /* ── CSS mode ─────────────────────────────────────────────────────── */
  /* Stylesheets come from the manifest, so one may be missing: the brand need not
     declare compare.legacy. Hence a null-safe helper. */
  function sheet(id, off) {
    var l = document.getElementById(id);
    if (l) l.disabled = !!off;
  }

  function applyCss(mode) {
    var isCurrent = mode === 'current';
    sheet('css-new-tokens', isCurrent);
    sheet('css-brand',    isCurrent);
    sheet('css-current',    !isCurrent);
    sheet('user-css',       true);
  }

  /* Brand styles delivered as a package: no server files, so tokens and components
     arrive as text. Same order as links: tokens first, then components. */
  function applyBrandCss(d) {
    /* Brand font: folder loader connects it from manifest; package gets the URL from
       the gallery — otherwise preview uses system font and size comparison is pointless. */
    if (d.font && !document.getElementById('bundle-font')) {
      var f = document.createElement('link');
      f.rel = 'stylesheet'; f.id = 'bundle-font'; f.href = d.font;
      document.head.appendChild(f);
    }
    ['tokens', 'components'].forEach(function (part) {
      var id = 'bundle-' + part;
      var el = document.getElementById(id);
      if (!el) {
        el = document.createElement('style');
        el.id = id;
        document.head.appendChild(el);
      }
      el.textContent = d[part] || '';
    });
    if (d.container) {
      document.documentElement.style.setProperty('--g-container', d.container + 'px');
    }
  }

  /* Arbitrary user-attached CSS replaces all built-in sets. Lets a developer
     compare their file to the DS without adding it to the repo. */
  function applyUserCss(text) {
    var el = document.getElementById('user-css');
    if (!el) {
      el = document.createElement('style');
      el.id = 'user-css';
      document.head.appendChild(el);
    }
    el.textContent = text || '';
    el.disabled = false;
    sheet('css-new-tokens', true);
    sheet('css-brand',    true);
    sheet('css-current',    true);
  }
  applyCss(qs.get('css') || 'new');

  /* ── Markup comes from the parent ─────────────────────────────────── */
  function setHtml(html) {
    root.innerHTML = html;
    Array.prototype.forEach.call(root.querySelectorAll('[data-pick]'), function (el) {
      el.classList.add('g-pick');
    });
    reportHeight();
  }

  /* Report height immediately and again on a tick.
     Do not use requestAnimationFrame: browsers throttle rAF in off-screen frames,
     the message never sent, frame stayed 150px default — content clipped. */
  var lastH = -1;
  function reportHeight() {
    var h = document.documentElement.scrollHeight;
    if (h !== lastH) { lastH = h; post({ type: 'g:height', height: h }); }
    setTimeout(function () {
      var h2 = document.documentElement.scrollHeight;
      if (h2 !== lastH) { lastH = h2; post({ type: 'g:height', height: h2 }); }
    }, 60);
  }

  function post(msg) {
    msg.frameId = qs.get('id') || '';
    parent.postMessage(msg, '*');
  }

  /* ── HTML formatting ───────────────────────────────────────────── */
  var VOID = { area:1, base:1, br:1, col:1, embed:1, hr:1, img:1, input:1,
               link:1, meta:1, source:1, track:1, wbr:1 };

  function formatNode(node, depth) {
    var pad = '  '.repeat(depth);
    if (node.nodeType === 3) {
      var t = node.textContent.trim();
      return t ? pad + t : '';
    }
    if (node.nodeType !== 1) return '';

    var tag = node.tagName.toLowerCase();
    var attrs = Array.prototype.filter.call(node.attributes, function (a) {
      return a.name !== 'data-pick' && a.name.indexOf('data-g-') !== 0;
    }).map(function (a) {
      // hide sandbox highlight class
      if (a.name === 'class') {
        var cls = a.value.split(/\s+/).filter(function (c) { return c !== 'g-pick'; }).join(' ');
        return cls ? ' class="' + cls + '"' : '';
      }
      return a.value === '' ? ' ' + a.name : ' ' + a.name + '="' + a.value + '"';
    }).join('');

    var open = pad + '<' + tag + attrs + '>';
    if (VOID[tag]) return open;

    var kids = Array.prototype.map.call(node.childNodes, function (c) {
      return formatNode(c, depth + 1);
    }).filter(Boolean);

    if (!kids.length) return open + '</' + tag + '>';
    // keep short single-line text inline
    if (kids.length === 1 && node.childNodes.length === 1 && node.firstChild.nodeType === 3) {
      return open + kids[0].trim() + '</' + tag + '>';
    }
    return open + '\n' + kids.join('\n') + '\n' + pad + '</' + tag + '>';
  }

  /* ── Collect CSS rules that actually apply to the node ───────────────────── */
  // Overly generic selectors (reset, base tag typography) — not this
  // component, and they only clutter the panel. Keep only what
  // hooks class, id, attribute, or state pseudo-class.
  function isGeneric(probe) {
    return !/[.#\[:]/.test(probe);
  }

  function matchesAny(el, selector) {
    // selector may be compound: "a, b, c"
    var parts = selector.split(',');
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (!s) continue;
      // strip pseudo-elements — el.matches does not handle them
      var probe = s.replace(/::?(before|after|placeholder|marker|selection|first-line|first-letter)\b/g, '')
                   .replace(/:(hover|focus|focus-visible|active|disabled|checked|not\([^)]*\))/g, '')
                   .trim();
      if (!probe || isGeneric(probe)) continue;
      try {
        if (el.matches(probe) || el.querySelector(probe)) return s;
      } catch (e) { /* invalid after cleanup — skip */ }
    }
    return null;
  }

  function ruleText(rule) {
    return rule.cssText;
  }

  function collectCss(el) {
    var out = [];
    var missing = false;

    for (var i = 0; i < document.styleSheets.length; i++) {
      var sheet = document.styleSheets[i];
      if (sheet.disabled) continue;
      var rules;
      try { rules = sheet.cssRules; } catch (e) { missing = true; continue; }
      if (!rules) { missing = true; continue; }

      walkRules(rules, out, el, null);
    }
    return { rules: out, blocked: missing && !out.length };
  }

  function walkRules(rules, out, el, mediaText) {
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];

      // ignore sandbox chrome layer entirely
      if (r.constructor && /CSSLayerBlockRule/.test(r.constructor.name) && r.name === 'g-chrome') continue;

      if (r.media) {                       // @media
        if (!window.matchMedia(r.conditionText || r.media.mediaText).matches) continue;
        walkRules(r.cssRules, out, el, r.conditionText || r.media.mediaText);
        continue;
      }
      if (r.cssRules && !r.selectorText) { // @layer, @supports
        walkRules(r.cssRules, out, el, mediaText);
        continue;
      }
      if (!r.selectorText) continue;

      if (matchesAny(el, r.selectorText)) {
        out.push({ media: mediaText, text: ruleText(r) });
      }
    }
  }

  /* ── Which tokens are used in these rules ────────────────────── */
  function usedTokens(rulesText) {
    var names = {};
    var re = /var\(\s*(--[\w-]+)/g, m;
    while ((m = re.exec(rulesText))) names[m[1]] = true;
    var cs = getComputedStyle(document.documentElement);
    return Object.keys(names).sort().map(function (n) {
      return { name: n, value: cs.getPropertyValue(n).trim() };
    }).filter(function (t) { return t.value; });
  }

  /* ── Click on an element ──────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-pick]');
    if (!el) return;
    e.preventDefault();

    var css = collectCss(el);
    var cssText = css.rules.map(function (r) {
      return r.media ? '@media ' + r.media + ' {\n  ' + r.text + '\n}' : r.text;
    }).join('\n\n');

    post({
      type: 'g:pick',
      name: el.getAttribute('data-pick') || el.className,
      selector: shortSelector(el),
      html: formatNode(el, 0),
      css: cssText,
      cssBlocked: css.blocked,
      tokens: usedTokens(cssText)
    });
  });

  function shortSelector(el) {
    var s = el.tagName.toLowerCase();
    var cls = (el.getAttribute('class') || '').split(/\s+/)
      .filter(function (c) { return c && c !== 'g-pick'; });
    return cls.length ? s + '.' + cls.join('.') : s;
  }

  /* ── Channel with parent ─────────────────────────────────────────────── */
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'g:render') setHtml(d.html);
    else if (d.type === 'g:css') { applyCss(d.mode); reportHeight(); }
    else if (d.type === 'g:usercss') { applyUserCss(d.text); reportHeight(); }
    else if (d.type === 'g:brandcss') { applyBrandCss(d); reportHeight(); }
  });

  window.addEventListener('load', reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  post({ type: 'g:ready' });
})();
</script>
</body>
</html>
