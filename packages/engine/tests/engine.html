<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<title>Engine tests</title>
<link rel="stylesheet" href="harness.css">
</head>
<body>
<h1>Engine tests</h1>
<p class="sub">Run against <code>brands/_template</code>: the engine must work with any brand.
If they pass on SDM and fail on the template — the engine picked up an SDM dependency.
<button id="rerun">Rerun</button></p>
<div id="summary">Running…</div>
<div id="out"></div>
<div id="stage"></div>

<script src="harness.js"></script>
<script src="contract.js"></script>
<script>
(function () {
  'use strict';
  function D() { return H.gallery().doc; }
  function G() { return H.gallery().win; }

  H.g('Shell');
  H.t('gallery rendered all sections', function () {
    var drawn = D().querySelectorAll('.g-section').length;
    var declared = G().GALLERY.length;
    H.ok(drawn > 0, 'gallery rendered zero sections');
    H.eq(drawn, declared, 'rendered sections vs declared');
  });
  H.t('no errors in gallery console', function () {
    H.eq((G().__errors || []).length, 0, 'errors ' + JSON.stringify(G().__errors || []));
  });
  H.t('all images in frames loaded', function () {
    var broken = [];
    D().querySelectorAll('iframe').forEach(function (f) {
      try {
        f.contentDocument.querySelectorAll('img').forEach(function (i) {
          if (i.naturalWidth === 0) broken.push(i.getAttribute('src'));
        });
      } catch (e) {}
    });
    H.eq(broken.length, 0, 'broken: ' + broken.slice(0, 3).join(', '));
  });
  H.t('both panes at same scale', function () {
    var m = D().querySelector('.g-pane--mobile iframe');
    var d = D().querySelector('.g-pane--desktop iframe');
    H.eq(m.style.transform, d.style.transform, 'pane scales');
  });

  H.g('Navigation');
  H.t('topbar shows default title at top', function () {
    var t1 = D().getElementById('g-current');
    H.ok(t1, 'no title in topbar');
    G().scrollTo(0, 0);
    G().GALLERY_API.spy();
    H.eq(t1.textContent.trim(),
      (G().BRAND_MANIFEST.description && G().BRAND_MANIFEST.description.trim()) ||
        G().ENGINE_BRAND.t('topbar.defaultTitle'),
       'topbar is not the default title');
  });
  H.t('scroll updates anchor, title matches', function () {
    /* Check consistency, not a specific section: on a short brand the last
       section physically cannot reach the top of the viewport, and requiring
       it would test page height, not spy. */
    var before = G().location.hash;
    var sections = D().querySelectorAll('.g-section');
    sections[sections.length - 1].scrollIntoView();
    // spy uses scroll geometry; in a parent-clipped frame events lag — force recalc
    G().GALLERY_API.spy();
    return H.wait(400).then(function () {
      var hash = G().location.hash;
      H.ok(hash && hash !== before, 'anchor did not change: ' + before + ' → ' + hash);
      var current = D().querySelector(hash + ' .g-section-head h2');
      H.ok(current, 'anchor points to missing section ' + hash);
      H.eq(D().getElementById('g-current').textContent.trim(),
         current.textContent.trim(), 'topbar title does not match anchor section');
    });
  });
  H.t('CSS switcher removed', function () {
    H.eq(D().getElementById('g-switch'), null, '#g-switch still in markup');
  });

  H.g('Compare with code');
  H.t('diff toggle disabled without attached CSS', function () {
    var b = D().getElementById('g-diff');
    H.ok(b, 'no toggle');
    H.eq(b.type, 'checkbox', 'not a checkbox');
    H.eq(b.disabled, true, 'should be disabled until file attached');
    G().GALLERY_API.setDiff(true);
    H.eq(b.checked, false, 'turned on without file');
  });
  H.t('diff toggle enabled after CSS load', function () {
    /* Previously the test pulled the site's styles.css — an engine test depending
       on a foreign repo. Any valid CSS is enough. */
    return Promise.resolve('.t-btn { height: 41px }').then(function (text) {
        G().GALLERY_API.setCompareCss(text, 'probe.css');
        H.eq(D().getElementById('g-diff').disabled, false, 'still disabled');
        H.eq(G().GALLERY_API.hasCompareCss(), true, 'CSS not saved');
        G().GALLERY_API.setDiff(true);
        H.eq(D().getElementById('g-diff').checked, true, 'did not turn on');
      });
  });
  H.t('diff panels compute', function () {
    // lazy build tied to scroll — ask section to compute explicitly
    H.ok(G().GALLERY_API, 'gallery did not expose GALLERY_API');
    H.ok(G().GALLERY_API.diffSection('buttons') > 0, 'no examples in section');
    return H.wait(9000).then(function () {
      var boxes = D().querySelectorAll('#buttons .g-example');
      var got = 0, stuck = 0, err = 0;
      [].forEach.call(boxes, function (b) {
        var d = b.querySelector('.g-diff');
        if (!d) return;
        got++;
        var h = d.querySelector('.g-diff-head').textContent;
        if (h.indexOf(G().ENGINE_BRAND.t('diff.computing')) >= 0) stuck++;
        if (h.indexOf(G().ENGINE_BRAND.t('diff.failed')) >= 0) err++;
      });
      H.ok(got > 0, 'no panels in section');
      H.eq(stuck, 0, stuck + ' stuck on "Computing differences…"');
      H.eq(err, 0, err + ' failed with error');
    });
  });
  H.t('section pick resets diff mode', function () {
    G().GALLERY_API.setDiff(true);
    D().querySelector('#g-nav a[data-section-id]').click();
    return H.wait(300).then(function () {
      H.ok(!D().getElementById('g-diff').checked, 'toggle stayed on');
      H.eq(D().querySelectorAll('.g-diff').length, 0, 'panels not removed');
    });
  });


  /* ── Checks that were missing before ────────────────────────────── */

  H.g('Resilience');
  H.t('token sections match brand descriptor', function () {
    var declared = Object.keys(G().BRAND_TOKENS || {}).length;
    var drawn = G().GALLERY.filter(function (s) {
      return ['colors', 'radii', 'shadows', 'blur', 'typography', 'sizes'].indexOf(s.id) >= 0;
    }).length;
    H.eq(drawn, declared, 'token sections vs token-map');
  });

  H.t('overlay CSS tab is non-empty', function () {
    var pick = D().querySelector('[data-pick]') ||
               (function () {
                 var f = D().querySelector('iframe');
                 try { return f.contentDocument.querySelector('[data-pick]'); } catch (e) { return null; }
               })();
    H.ok(pick, 'no data-pick to open overlay');
    pick.click();
    return H.wait(300).then(function () {
      var body = D().getElementById('g-ov-body');
      H.ok(body && body.textContent.trim().length > 0, 'overlay empty');
      var close = D().getElementById('g-ov-close');
      if (close) close.click();
    });
  });

  H.t('source badge is a button and opens a file slice', function () {
    var slice = G().ENGINE_SRC_SLICE;
    H.ok(slice, 'ENGINE_SRC_SLICE missing');
    var parsed = slice.parse('tokens.css §1–2', { tokens: 'tokens.css' });
    H.eq(parsed.kind, 'range', 'did not parse § range');
    H.eq(parsed.from, 1);
    H.eq(parsed.to, 2);
    var css = '/* skip */\n:root {\n' +
      '/* --------------------------------------------------------------------------\n   1. Brand\n   -------------------------------------------------------------------------- */\n' +
      '  --blue: #00f;\n' +
      '/* --------------------------------------------------------------------------\n   2. Text\n   -------------------------------------------------------------------------- */\n' +
      '  --text: #111;\n' +
      '/* --------------------------------------------------------------------------\n   3. Other\n   -------------------------------------------------------------------------- */\n' +
      '  --other: #eee;\n}\n';
    var out = slice.slice(css, parsed);
    H.ok(out.indexOf('--blue') >= 0, 'range missed section 1');
    H.ok(out.indexOf('--text') >= 0, 'range missed section 2');
    H.ok(out.indexOf('--other') < 0, 'range leaked section 3');

    var badge = D().querySelector('.g-src-badge');
    H.ok(badge && badge.tagName === 'BUTTON', 'badge is not a button');
    badge.click();
    return H.wait(400).then(function () {
      var ov = D().getElementById('g-overlay');
      H.ok(ov && ov.classList.contains('is-open'), 'drawer did not open');
      var body = D().getElementById('g-ov-body');
      H.ok(body && body.textContent.indexOf('--') >= 0, 'drawer has no CSS');
      var close = D().getElementById('g-ov-close');
      if (close) close.click();
    });
  });

  H.t('html examples share the catalogue row cell', function () {
    var rows = G().ENGINE_ROWS;
    H.ok(rows && rows.wrapBlock, 'ENGINE_ROWS.wrapBlock missing');
    var wrapped = rows.wrapBlock('<div class="card" data-pick=".card">x</div>');
    H.ok(wrapped.indexOf('g-row g-row--block') >= 0, 'html was not wrapped in a row');
    H.ok(wrapped.indexOf('data-pick=".card"') >= 0, 'wrap stripped data-pick');
    var bleed = rows.wrapBlock('<section class="hero g-inset" data-pick=".hero"></section>');
    H.ok(bleed.indexOf('g-row--bleed') >= 0, 'hero/g-inset did not skip padding');
    var dark = rows.wrapBlock('<div data-pick=".x">x</div>', { surface: 'dark' });
    H.ok(dark.indexOf('g-row--dark') < 0, 'dark belongs on the frame, not the row');
    var darkFrame = Array.prototype.find.call(D().querySelectorAll('iframe'), function (f) {
      return f.src.indexOf('surface=dark') >= 0;
    });
    H.ok(darkFrame, 'template has no dark-surface frame');
    var htmlEl = darkFrame.contentDocument && darkFrame.contentDocument.documentElement;
    H.ok(htmlEl && htmlEl.classList.contains('g-surface-dark'), 'frame html missing g-surface-dark');
    H.ok(htmlEl && htmlEl.classList.contains('card--dark'), 'frame html missing card--dark');
    var f = D().querySelector('iframe');
    var doc = f && f.contentDocument;
    H.ok(doc && doc.querySelector('.g-row'), 'template frame has no .g-row');
  });

  H.t('short example pane hugs the cell', function () {
    /* A short specimen must not sit in the iframe's ~150px default with a
       hole under the hover. Height follows #root = the cell. */
    return H.wait(400).then(function () {
      var f = Array.prototype.find.call(D().querySelectorAll('iframe'), function (fr) {
        return fr.src.indexOf('surface=dark') >= 0;
      });
      H.ok(f, 'template has no dark-surface frame');
      var doc = f.contentDocument;
      var rootEl = doc && doc.getElementById('root');
      var row = doc && doc.querySelector('.g-row');
      H.ok(rootEl && row, 'dark frame has no cell');
      var iframeH = parseFloat(f.style.height);
      var rootH = rootEl.getBoundingClientRect().height;
      var cellH = row.getBoundingClientRect().height;
      H.ok(iframeH > 0 && iframeH < 150, 'iframe still on default height: ' + iframeH);
      H.ok(Math.abs(iframeH - rootH) <= 2, 'iframe ' + iframeH + ' vs root ' + rootH);
      H.ok(Math.abs(rootH - cellH) <= 2, 'root taller than cell: ' + rootH + ' vs ' + cellH);
    });
  });

  H.t('highlight is flush, no radius', function () {
    var f = D().querySelector('iframe');
    var doc = f && f.contentDocument;
    var row = doc && doc.querySelector('.g-row');
    H.ok(row, 'template frame has no .g-row');
    var cs = doc.defaultView.getComputedStyle(row);
    H.eq(parseFloat(cs.borderTopLeftRadius) || 0, 0, 'highlight still has radius');
    var rr = row.getBoundingClientRect();
    var ir = doc.documentElement.getBoundingClientRect();
    H.ok(Math.abs(rr.left - ir.left) <= 1, 'left gap around highlight: ' + (rr.left - ir.left));
    H.ok(Math.abs(rr.right - ir.right) <= 1, 'right gap around highlight: ' + (ir.right - rr.right));
  });

  H.t('row highlight spans the pane, not the viewport', function () {
    return H.wait(400).then(function () {
      var pane = D().querySelector('.g-pane--mobile');
      H.ok(pane, 'no mobile pane');
      var wrap = pane.querySelector('.g-frame-wrap');
      var hits = wrap && wrap.querySelector('.g-row-hits');
      var hit = hits && hits.querySelector('.g-row-hit');
      H.ok(hit, 'mobile pane has no row hit');
      var dw = wrap.getBoundingClientRect().width;
      var hw = hit.getBoundingClientRect().width;
      H.ok(Math.abs(hw - dw) <= 2, 'hit ' + hw + ' vs pane ' + dw);
    });
  });

  H.t('desktop outer row fills the pane, not the mobile viewport', function () {
    var pane = D().querySelector('.g-pane--desktop');
    var wrap = pane && pane.querySelector('.g-frame-wrap');
    var iframe = pane && pane.querySelector('iframe');
    H.ok(wrap && iframe, 'no desktop pane');
    var dw = wrap.getBoundingClientRect().width;
    var iw = iframe.getBoundingClientRect().width;
    H.ok(Math.abs(iw - dw) <= 2, 'desktop iframe ' + Math.round(iw) + ' vs pane ' + Math.round(dw));
  });

  H.t('mountFrame is the only preview path', function () {
    /* Invariant held by convention. Every gallery iframe must be our frame with
       brand=: otherwise someone mounted a preview bypassing it and it gets no
       brand styles or messages. */
    var bad = [];
    D().querySelectorAll('iframe').forEach(function (f) {
      if (f.src.indexOf('_frame.html') < 0 || f.src.indexOf('brand=') < 0) bad.push(f.src || '(no src)');
    });
    H.eq(bad.length, 0, 'bypassed mountFrame: ' + bad.slice(0, 2).join(', '));
  });

  H.t('broken tokens file shows hint, not blank', function () {
    /* Test behaviour, not copy: engine must explain why it is empty. */
    var hint = G().ENGINE_BRAND.t('token.brokenTokens');
    H.ok(hint && hint !== 'token.brokenTokens', 'no hint string in locale pack');
    H.ok(G().ENGINE_SPECS.vars.ready || G().ENGINE_SPECS.vars.broken,
       'parser reported neither ready nor broken');
  });

  H.g('Locale');
  H.t('brand without locale opens in English', function () {
    var m = G().BRAND_MANIFEST;
    if (m.locale) { H.ok(true, 'brand has locale — check N/A'); return; }
    H.eq(D().querySelector('[data-i18n="topbar.attach"]').textContent, 'Attach CSS');
  });
  H.t('missing key falls back to key, not empty', function () {
    var t = G().ENGINE_BRAND.t;
    H.ok(t('overlay.copyHtml').length > 0, 'empty string instead of value');
    H.eq(t('no.such.key'), 'no.such.key', 'missing key should return the key');
  });

  H.g('Switcher');
  H.t('workspace menu: Home instead of libra list', function () {
    var doc = D();
    doc.getElementById('g-mark').click();
    H.ok(doc.getElementById('g-home'), 'no Home item');
    H.ok(!doc.getElementById('g-suite-list'), 'libra list still in menu');
    H.eq(doc.getElementById('g-home').textContent.trim(), G().ENGINE_BRAND.t('menu.home'));
  });

  H.t('reference brand hides delete and settings', function () {
    var doc = D();
    var del = doc.getElementById('g-delete');
    var settings = doc.getElementById('g-settings');
    H.ok(del && del.hidden, 'delete visible on reference brand');
    H.ok(settings && settings.hidden, 'settings visible on reference brand');
  });

  H.t('duplicate opens dialog, not settings', function () {
    var doc = D();
    doc.getElementById('g-mark').click();
    doc.getElementById('g-duplicate').click();
    return H.wait(200).then(function () {
      H.eq(doc.getElementById('g-dup-scrim').hidden, false, 'duplicate dialog did not open');
      H.eq(doc.getElementById('g-settings-scrim').hidden, true, 'opened settings');
      doc.getElementById('g-dup-cancel').click();
    });
  });

  H.g('Code comparison');

  /* Inject CSS as a string and inspect DOM notes: internal functions are not
     exported, and we should verify what the user sees. */
  function withCompare(css) {
    var G_ = G();
    G_.GALLERY_API.setCompareCss(css, 'probe.css');
    G_.GALLERY_API.setDiff(true);
    return H.wait(900);
  }
  function notes(sectionId) {
    return [].map.call(
      D().querySelectorAll('#' + sectionId + ' .g-warn, #' + sectionId + ' .g-ok'),
      function (el) { return el.textContent.trim(); });
  }

  H.t('tokens have no notes without compare', function () {
    G().GALLERY_API.setDiff(false);
    return H.wait(500).then(function () {
      H.eq(notes('colors').length, 0, 'colors notes code when not asked');
      H.eq(notes('sizes').length, 0, 'sizes notes code when not asked');
    });
  });

  H.t('value mismatch marked as mismatch', function () {
    /* Template has --blue blue; inject red under the same name. */
    return withCompare(':root { --blue: #FF0000; }').then(function () {
      var warn = notes('colors').filter(function (text) {
        return text.indexOf('#FF0000') >= 0 || text.toUpperCase().indexOf('FF0000') >= 0;
      });
      H.ok(warn.length > 0, 'other value not shown: ' + notes('colors').join(' · '));
    });
  });

  H.t('token found by value under other name', function () {
    var G_ = G();
    /* No --r-card in injected file; 12px exists under its own name — as in
       production where radii live in a separate set. */
    return withCompare(':root { --m-radius-12: 12px; }').then(function () {
      var found = notes('radii').filter(function (text) {
        return text.indexOf('--m-radius-12') >= 0;
      });
      H.ok(found.length > 0, 'not found by value: ' + notes('radii').join(' · '));
    });
  });

  H.t('same value of different kind not matched', function () {
    /* Main case: 12px for radius and 12px for heading are different things;
       suggesting one as the name of the other is worse than silence. */
    return withCompare(':root { --font-h1-size: 12px; }').then(function () {
      var wrong = notes('radii').filter(function (text) {
        return text.indexOf('--font-h1-size') >= 0;
      });
      H.eq(wrong.length, 0, 'radius offered typography name');
    });
  });

  H.t('"in attached CSS" column appears with compare', function () {
    var G_ = G();
    var heads = function () {
      return [].map.call(D().querySelectorAll('#sizes table th'),
                         function (el) { return el.textContent.trim(); });
    };
    var label = G_.ENGINE_BRAND.t('tok.inCode');

    return withCompare(':root { --space-m: 16px; }').then(function () {
      H.ok(heads().indexOf(label) >= 0, 'column missing with compare on');
      G_.GALLERY_API.setDiff(false);
      return H.wait(500);
    }).then(function () {
      H.eq(heads().indexOf(label), -1, 'column remained after compare off');
    });
  });

  H.g('New storybook');

  H.t('menu item opens dialog, Cancel closes', function () {
    /* Both buttons already lost handlers when code was rearranged — only
       noticeable by hand: menu item silently did nothing. */
    var doc = D();
    doc.getElementById('g-mark').click();
    doc.getElementById('g-new').click();
    return H.wait(250).then(function () {
      H.eq(doc.getElementById('g-new-scrim').hidden, false, 'dialog did not open');
      doc.getElementById('g-new-close').click();
      return H.wait(200);
    }).then(function () {
      H.eq(doc.getElementById('g-new-scrim').hidden, true, 'Cancel did not close dialog');
    });
  });

  H.t('wizard: pick scenario → step 2 → back', function () {
    var doc = D();
    doc.getElementById('g-mark').click();
    doc.getElementById('g-new').click();

    return H.wait(250).then(function () {
      var choices = doc.querySelector('#g-new-scrim .g-choices');
      H.ok(choices.offsetHeight > 0, 'scenarios not visible on step 1');
      H.eq(doc.getElementById('g-new-step2').offsetHeight, 0, 'step 2 shown immediately');

      doc.getElementById('g-new-blank').click();
      return H.wait(200);
    }).then(function () {
      /* First step must leave: two screens at once is not a wizard. */
      H.eq(doc.querySelector('#g-new-scrim .g-choices').offsetHeight, 0,
         'scenarios still visible on step 2');
      H.ok(doc.getElementById('g-new-step2').offsetHeight > 0, 'step 2 not shown');
      H.ok(doc.getElementById('g-new-name').value.length > 0, 'name not prefilled');
      H.eq(doc.getElementById('g-new-address-row').hidden, false, 'address hidden with name filled');
      H.ok(/^\/[a-z0-9-]+$/.test(doc.getElementById('g-new-address').textContent),
         'address not shown: ' + doc.getElementById('g-new-address').textContent);

      doc.getElementById('g-new-back').click();
      return H.wait(200);
    }).then(function () {
      H.ok(doc.querySelector('#g-new-scrim .g-choices').offsetHeight > 0,
         'Back did not return to scenario pick');

      doc.getElementById('g-new-css').click();
      return H.wait(200);
    }).then(function () {
      H.eq(doc.getElementById('g-new-address-row').hidden, true,
         'address visible before name in CSS scenario');
      doc.getElementById('g-new-close').click();
    });
  });

  H.t('address derived from name and transliterated', function () {
    var G_ = G();
    H.eq(G_.ENGINE_SLUG.slug('New storybook'), 'new-storybook');
    H.eq(G_.ENGINE_SLUG.slug('\u041c\u043e\u0439 \u0431\u0440\u0435\u043d\u0434'), 'moy-brend', 'Cyrillic not transliterated');
    H.eq(G_.ENGINE_SLUG.slug('   ---   '), 'storybook', 'empty name without fallback');
  });

  /* Contract: brand must declare tokens required for chrome to render. */
  H.contractTests();

  H.run();
})();
</script>
</body>
</html>
