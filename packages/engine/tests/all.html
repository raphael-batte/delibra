<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<title>SDM Gallery — тесты</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px 32px 80px; background: #FBFCFD; color: #333;
         font: 14px/1.5 Inter, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { margin: 0 0 20px; font-size: 12px; color: #757575; }
  #summary { position: sticky; top: 0; padding: 12px 0; margin-bottom: 12px;
             background: #FBFCFD; border-bottom: 1px solid #D5DBE8; font-weight: 600; }
  .ok   { color: #17AA26; }
  .fail { color: #DF3500; }
  .skip { color: #757575; }
  .grp { margin: 22px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
         text-transform: uppercase; color: #757575; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 8px; border-bottom: 1px solid #EBF1F8; vertical-align: top; font-size: 13px; }
  td.st { width: 26px; font-weight: 700; }
  td.msg { color: #757575; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  /* Сцена должна ОТРИСОВЫВАТЬСЯ: галерея строит панели различий лениво, через
     IntersectionObserver, а в полностью уведённом за экран фрейме он молчит.
     Поэтому держим её на экране, но прижатой в угол и почти прозрачной. */
  #stage { position: fixed; left: 0; bottom: 0; width: 300px; height: 220px;
           overflow: hidden; opacity: .02; pointer-events: none; z-index: -1; }
  button { height: 32px; padding-inline: 14px; border: 1px solid #D5DBE8; border-radius: 20px;
           background: #fff; font: 600 12px Inter, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<h1>Тесты галереи</h1>
<p class="sub">Гоняют настоящую <code>gallery.html</code> в скрытом фрейме и проверяют инварианты,
которые уже ломались. <button id="rerun">Перезапустить</button></p>
<div id="summary">Запускаю…</div>
<div id="out"></div>
<div id="stage"></div>

<script>
(function () {
  'use strict';

  var results = [], group = '';
  function g(name) { group = name; }
  function t(name, fn) { results.push({ group: group, name: name, fn: fn }); }

  function eq(actual, expected, what) {
    if (String(actual) !== String(expected)) {
      throw new Error((what ? what + ': ' : '') + 'ожидалось ' + expected + ', получено ' + actual);
    }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'условие не выполнено'); }

  /* ── доступ к галерее ─────────────────────────────────────────────── */
  var G;                       // window галереи
  var D;                       // document галереи

  function frames(sectionId, sel) {
    var out = [];
    D.querySelectorAll('#' + sectionId + ' iframe').forEach(function (f) {
      try { if (!sel || f.contentDocument.querySelector(sel)) out.push(f); } catch (e) {}
    });
    return out;
  }
  /* В секции несколько примеров, и нужный элемент может быть в любом из них —
     ищем первую панель нужного брейкпоинта, где селектор действительно есть. */
  function pane(sectionId, which, sel) {
    var list = D.querySelectorAll('#' + sectionId + ' .g-pane--' + which + ' iframe');
    ok(list.length, 'нет панели ' + which + ' в секции ' + sectionId);
    var first = null;
    for (var i = 0; i < list.length; i++) {
      var d;
      try { d = list[i].contentDocument; } catch (e) { continue; }
      if (!d) continue;
      if (!first) first = d;
      if (!sel) break;
      var el = d.querySelector(sel);
      if (el) return { doc: d, win: d.defaultView, el: el };
    }
    ok(first, 'панели ' + which + ' не загрузились в ' + sectionId);
    return { doc: first, win: first.defaultView, el: sel ? first.querySelector(sel) : null };
  }
  function css(sectionId, which, sel, prop) {
    var p = pane(sectionId, which, sel);
    ok(p.el, 'не найден ' + sel + ' в ' + sectionId + '/' + which);
    return p.win.getComputedStyle(p.el)[prop];
  }
  function px(v) { return Math.round(parseFloat(v)); }

  /* ══════════════════════════════════════════════════════════════════
     ТЕСТЫ
     ══════════════════════════════════════════════════════════════ */

  g('Каркас');
  t('галерея отрисовала все секции', function () {
    ok(D.querySelectorAll('.g-section').length >= 20,
       'секций всего ' + D.querySelectorAll('.g-section').length);
  });
  t('нет ошибок в консоли галереи', function () {
    eq((G.__errors || []).length, 0, 'ошибок ' + JSON.stringify(G.__errors || []));
  });
  t('все картинки во фреймах загрузились', function () {
    var broken = [];
    D.querySelectorAll('iframe').forEach(function (f) {
      try {
        f.contentDocument.querySelectorAll('img').forEach(function (i) {
          if (i.naturalWidth === 0) broken.push(i.getAttribute('src'));
        });
      } catch (e) {}
    });
    eq(broken.length, 0, 'битые: ' + broken.slice(0, 3).join(', '));
  });
  t('обе панели в одном масштабе', function () {
    var m = D.querySelector('.g-pane--mobile iframe');
    var d = D.querySelector('.g-pane--desktop iframe');
    eq(m.style.transform, d.style.transform, 'масштабы панелей');
  });

  g('Токены');
  t('палитра непустая и без пропусков', function () {
    var sw = D.querySelectorAll('#colors .g-swatch');
    ok(sw.length >= 30, 'свотчей ' + sw.length);
    eq(D.querySelectorAll('#colors .g-missing').length, 0, 'штрихованных свотчей');
  });
  t('в палитре ровно 7 светлых тинтов', function () {
    var names = [];
    D.querySelectorAll('#colors .g-swatch').forEach(function (s) {
      var n = s.querySelectorAll('.g-swatch-val')[1];
      if (n && /^--card-(slate|blue|indigo|lilac|teal|peach|rose)$/.test(n.textContent.trim()))
        names.push(n.textContent.trim());
    });
    eq(names.length, 7, 'нашлось ' + names.join(', '));
  });
  t('минта и sky в палитре нет', function () {
    var txt = D.getElementById('colors').innerHTML;
    ok(txt.indexOf('--card-mint') < 0, 'найден --card-mint');
    ok(txt.indexOf('--card-sky') < 0, 'найден --card-sky');
  });
  t('типографика показывает оба брейкпоинта', function () {
    ok(D.querySelectorAll('#typography .g-pane-label').length >= 2, 'нет двух колонок специмена');
    ok(D.querySelectorAll('#typography tbody tr').length >= 10, 'мало строк в шкале');
  });
  t('радиус карточки 24 на десктопе и 16 на мобайле', function () {
    eq(px(css('steps', 'desktop', '.step', 'borderTopLeftRadius')), 24, 'desktop');
    eq(px(css('steps', 'mobile',  '.step', 'borderTopLeftRadius')), 16, 'mobile');
  });

  g('Кнопки');
  t('высоты sm/med/lg на десктопе — 40/52/64', function () {
    eq(px(css('buttons', 'desktop', '.btn-sm', 'height')), 40, 'sm');
    eq(px(css('buttons', 'desktop', '.btn-primary:not(.btn-sm):not(.btn-lg)', 'height')), 52, 'med');
    eq(px(css('buttons', 'desktop', '.btn-lg', 'height')), 64, 'lg');
  });
  t('на мобайле btn и btn-lg схлопываются в 48', function () {
    eq(px(css('buttons', 'mobile', '.btn-primary:not(.btn-sm):not(.btn-lg)', 'height')), 48, 'btn');
    eq(px(css('buttons', 'mobile', '.btn-lg', 'height')), 48, 'btn-lg');
  });
  t('мобильная кнопка НЕ крупнее десктопной', function () {
    var m = px(css('buttons', 'mobile',  '.btn-primary:not(.btn-sm):not(.btn-lg)', 'height'));
    var d = px(css('buttons', 'desktop', '.btn-primary:not(.btn-sm):not(.btn-lg)', 'height'));
    ok(m <= d, 'mobile ' + m + ' > desktop ' + d);
  });
  t('радиус кнопки одинаков на обоих брейкпоинтах', function () {
    eq(px(css('buttons', 'mobile',  '.btn-primary', 'borderTopLeftRadius')),
       px(css('buttons', 'desktop', '.btn-primary', 'borderTopLeftRadius')), 'радиус');
  });

  g('Тёмный контекст');
  t('карточка действительно тёмная', function () {
    var bg = css('buttons', 'desktop', '.card--dark', 'backgroundColor');
    var rgb = bg.match(/\d+/g).map(Number);
    ok(rgb[0] + rgb[1] + rgb[2] < 240, 'фон светлый: ' + bg);
  });
  t('primary инвертируется в белую', function () {
    eq(css('buttons', 'desktop', '.card--dark .btn-primary', 'backgroundColor'), 'rgb(255, 255, 255)');
  });
  t('outline на тёмном — сплошная белая рамка', function () {
    var sh = css('buttons', 'desktop', '.card--dark .btn-outline', 'boxShadow');
    ok(sh.indexOf('rgb(255, 255, 255)') >= 0, 'рамка не сплошная белая: ' + sh);
  });
  t('текст чек-листа белый', function () {
    eq(css('check', 'desktop', '.card--dark .check', 'color'), 'rgb(255, 255, 255)');
  });
  t('иконка чек-листа белая', function () {
    eq(css('check', 'desktop', '.card--dark .check .ic', 'backgroundColor'), 'rgb(255, 255, 255)');
  });

  g('Иконки');
  /* Иконки нормализованы по ВЫСОТЕ: канвасы исходных SVG разные
     (i-h02 37×50, i-sm04 47×37 …), поэтому ширина у каждой своя. */
  t('высота иконки 24 на мобайле и 36 на десктопе', function () {
    eq(px(css('icon-tiles', 'mobile',  '.icon', 'height')), 24, 'mobile');
    eq(px(css('icon-tiles', 'desktop', '.icon', 'height')), 36, 'desktop');
  });
  t('высота иконок одинакова во всех секциях', function () {
    var bad = {};
    D.querySelectorAll('iframe').forEach(function (f) {
      try {
        var d = f.contentDocument;
        var want = f.style.width === '1440px' ? 36 : 24;
        d.querySelectorAll('.icon-tile img, img.icon').forEach(function (i) {
          var h = Math.round(i.getBoundingClientRect().height);
          if (h !== want) bad[i.getAttribute('src').split('/').pop() + ' = ' + h + ' вместо ' + want] = 1;
        });
      } catch (e) {}
    });
    var list = Object.keys(bad);
    eq(list.length, 0, list.slice(0, 4).join('; '));
  });
  t('перк цветной и без тени', function () {
    var p = pane('perks', 'desktop', '.perk');
    ok(p.el, 'нет .perk');
    var cs = p.win.getComputedStyle(p.el);
    ok(cs.backgroundColor !== 'rgb(255, 255, 255)', 'перк белый — в ДС он всегда цветной');
    eq(cs.boxShadow, 'none', 'у перка не должно быть тени');
  });
  t('перк есть на мобайле и шириной 250', function () {
    var p = pane('perks', 'mobile', '.perk');
    ok(p.el, 'на мобайле нет .perk');
    eq(px(p.win.getComputedStyle(p.el).width), 250, 'ширина');
  });
  t('есть перк с металлическим плейсхолдером', function () {
    var p = pane('perks', 'desktop', '.perk .icon-tile--metal');
    ok(p.el, 'нет плитки .icon-tile--metal внутри перка');
    ok(p.win.getComputedStyle(p.el).backgroundImage.indexOf('gradient') >= 0, 'у плитки нет градиента');
  });

  t('иконка внутри плитки той же высоты', function () {
    eq(px(css('icon-tiles', 'mobile',  '.icon-tile:not(.num) img', 'height')), 24, 'mobile');
    eq(px(css('icon-tiles', 'desktop', '.icon-tile:not(.num) img', 'height')), 36, 'desktop');
  });
  t('плитки: малая 44, обычная 52, числовая 56 (мобайл)', function () {
    eq(px(css('icon-tiles', 'mobile', '.icon-tile--sm', 'width')), 44, 'малая');
    eq(px(css('icon-tiles', 'mobile', '.icon-tile:not(.num):not(.icon-tile--sm):not(.icon-tile--metal)', 'width')), 52, 'обычная');
    eq(px(css('icon-tiles', 'mobile', '.icon-tile.num', 'width')), 56, 'числовая');
  });
  t('плитка под иконку белая, металл только у числовой', function () {
    var p = pane('icon-tiles', 'desktop');
    var tile = p.doc.querySelector('.icon-tile:not(.num):not(.icon-tile--metal)');
    var num  = p.doc.querySelector('.icon-tile.num');
    eq(p.win.getComputedStyle(tile).backgroundColor, 'rgb(255, 255, 255)', 'плитка');
    ok(p.win.getComputedStyle(num).backgroundImage.indexOf('gradient') >= 0, 'у числовой нет градиента');
  });

  g('Блоки');
  t('кнопки обложки стоят в строку на обоих брейкпоинтах', function () {
    ['mobile', 'desktop'].forEach(function (w) {
      var p = pane('covers', w, '.hero-actions');
      ok(p.el, 'нет .hero-actions');
      var b = p.el.querySelectorAll('.btn');
      eq(b[0].offsetTop, b[1].offsetTop, w + ': кнопки на разных строках');
    });
  });
  t('обложка: высота 768 по центру и 664 у split', function () {
    var c = pane('covers', 'desktop', '.hero:not(.hero--split)');
    var s = pane('covers', 'desktop', '.hero--split');
    eq(px(c.win.getComputedStyle(c.el).height), 768, 'обычная');
    eq(px(s.win.getComputedStyle(s.el).height), 664, 'split');
  });
  t('открытый пункт FAQ белый с градиентной рамкой', function () {
    var p = pane('faq', 'desktop', '.docs-acc__item.is-open');
    ok(p.el, 'нет раскрытого пункта');
    eq(p.win.getComputedStyle(p.el).backgroundColor, 'rgb(255, 255, 255)', 'фон');
    var before = p.win.getComputedStyle(p.el, '::before');
    ok(before.backgroundImage.indexOf('gradient') >= 0, 'рамка не градиентная');
    eq(before.opacity, '1', 'рамка не показана');
  });
  t('в палитре есть группа градиентов', function () {
    var html = D.getElementById('colors').innerHTML;
    ok(html.indexOf('7. Градиенты') >= 0, 'нет группы градиентов');
    ['--metal', '--lilac-grad', '--featured-pkg-border'].forEach(function (n) {
      ok(html.indexOf(n) >= 0, 'нет ' + n);
    });
  });
  t('снятые токены убраны из палитры', function () {
    var html = D.getElementById('colors').innerHTML;
    ok(html.indexOf('--purple-line') < 0, '--purple-line остался в палитре');
    ok(!/>--green</.test(html), '--green остался в палитре');
  });
  t('баннер: строка на десктопе, колонка на мобайле', function () {
    eq(css('banner', 'desktop', '.cta-band', 'flexDirection'), 'row');
    eq(css('banner', 'mobile',  '.cta-band', 'flexDirection'), 'column');
  });
  t('тинт карточки продукта — из палитры', function () {
    var p = pane('product-cards', 'desktop', '.product');
    ok(p.el, 'нет .product');
    // семь тинтов палитры; снятых mint/sky/blue-2 быть не должно
    var palette = ['rgb(179, 192, 208)', 'rgb(211, 234, 253)', 'rgb(221, 232, 253)',
                   'rgb(225, 216, 238)', 'rgb(171, 212, 210)', 'rgb(250, 228, 213)',
                   'rgb(231, 185, 180)'];
    var bg = p.win.getComputedStyle(p.el).backgroundColor;
    ok(palette.indexOf(bg) >= 0, 'тинт вне палитры: ' + bg);
  });
  t('в примерах нет снятых тинтов', function () {
    // mint и blue-2 сняты; #D6E2FB остаётся как заливка hero-карточки (--hero-card-2)
    var bad = ['rgb(188, 227, 237)', 'rgb(204, 222, 240)'];
    var hits = [];
    D.querySelectorAll('iframe').forEach(function (f) {
      try {
        var d = f.contentDocument, w = d.defaultView;
        d.querySelectorAll('[class]').forEach(function (e) {
          var bg = w.getComputedStyle(e).backgroundColor;
          if (bad.indexOf(bg) >= 0) hits.push(e.className + ' → ' + bg);
        });
      } catch (e) {}
    });
    eq(hits.length, 0, hits.slice(0, 3).join('; '));
  });

  g('Навигация');
  t('наверху в шапке общий заголовок', function () {
    var t1 = D.getElementById('g-current');
    ok(t1, 'нет заголовка в шапке');
    G.scrollTo(0, 0);
    G.GALLERY_API.spy();
    eq(t1.textContent.trim(), 'Дизайн-система и компоненты сайта');
  });
  t('прокрутка меняет якорь и заголовок', function () {
    D.getElementById('faq').scrollIntoView();
    // спай считает по скроллу; во фрейме, обрезанном родителем, события
    // приходят с задержкой — просим пересчитать явно
    G.GALLERY_API.spy();
    return wait(400).then(function () {
      eq(G.location.hash, '#faq', 'якорь');
      eq(D.getElementById('g-current').textContent.trim(),
         D.querySelector('#faq .g-section-head h2').textContent.trim(), 'заголовок');
    });
  });
  t('переключателя CSS больше нет', function () {
    eq(D.getElementById('g-switch'), null, '#g-switch остался в разметке');
  });

  g('Сравнить с кодом');
  t('без приложенного CSS тоггл заблокирован', function () {
    var b = D.getElementById('g-diff');
    ok(b, 'нет тоггла');
    eq(b.type, 'checkbox', 'это не переключатель');
    eq(b.disabled, true, 'должен быть заблокирован, пока нет файла');
    G.GALLERY_API.setDiff(true);
    eq(b.checked, false, 'включился без файла');
  });
  t('после загрузки CSS тоггл разблокирован', function () {
    return fetch('../ui2026/app/styles.css').then(function (r) { return r.text(); })
      .then(function (text) {
        G.GALLERY_API.setCompareCss(text, 'styles.css');
        eq(D.getElementById('g-diff').disabled, false, 'остался заблокированным');
        eq(G.GALLERY_API.hasCompareCss(), true, 'CSS не сохранён');
        G.GALLERY_API.setDiff(true);
        eq(D.getElementById('g-diff').checked, true, 'не включился');
      });
  });
  t('панели различий считаются', function () {
    // сборка ленивая и завязана на прокрутку — просим раздел посчитаться явно
    ok(G.GALLERY_API, 'галерея не отдала GALLERY_API');
    ok(G.GALLERY_API.diffSection('buttons') > 0, 'в разделе нет примеров');
    return wait(9000).then(function () {
      var boxes = D.querySelectorAll('#buttons .g-example');
      var got = 0, stuck = 0, err = 0;
      [].forEach.call(boxes, function (b) {
        var d = b.querySelector('.g-diff');
        if (!d) return;
        got++;
        var h = d.querySelector('.g-diff-head').textContent;
        if (/Считаю/.test(h)) stuck++;
        if (/Не удалось/.test(h)) err++;
      });
      ok(got > 0, 'панелей в секции нет');
      eq(stuck, 0, stuck + ' зависли на «Считаю различия…»');
      eq(err, 0, err + ' завершились ошибкой');
    });
  });
  t('выбор раздела сбрасывает режим', function () {
    G.GALLERY_API.setDiff(true);
    D.querySelector('#g-nav a[href="#faq"]').click();
    return wait(300).then(function () {
      ok(!D.getElementById('g-diff').checked, 'тоггл остался включённым');
      eq(D.querySelectorAll('.g-diff').length, 0, 'панели не убрались');
    });
  });

  /* ══════════════════════════════════════════════════════════════════
     Раннер
     ══════════════════════════════════════════════════════════════ */
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var out = document.getElementById('out');
  var summary = document.getElementById('summary');

  function run() {
    out.innerHTML = '';
    summary.textContent = 'Загружаю галерею…';
    var stage = document.getElementById('stage');
    stage.innerHTML = '';
    var f = document.createElement('iframe');
    f.style.cssText = 'width:1600px;height:1200px;border:0';
    f.src = 'gallery.html?css=new&test=1&t=' + Date.now();
    stage.appendChild(f);

    f.addEventListener('load', function () {
      G = f.contentWindow;
      D = f.contentDocument;
      G.__errors = [];
      G.addEventListener('error', function (e) { G.__errors.push(String(e.message)); });
      summary.textContent = 'Жду отрисовку превью…';
      wait(5000).then(runAll);
    });
  }

  function runAll() {
    var pass = 0, fail = 0, lastGroup = null, chain = Promise.resolve();

    results.forEach(function (r) {
      chain = chain.then(function () {
        if (r.group !== lastGroup) {
          lastGroup = r.group;
          var h = document.createElement('div');
          h.className = 'grp';
          h.textContent = r.group;
          out.appendChild(h);
          var tb = document.createElement('table');
          out.appendChild(tb);
        }
        var table = out.querySelector('table:last-of-type');
        return Promise.resolve()
          .then(r.fn)
          .then(function () { pass++; row(table, 'ok', '✓', r.name, ''); },
                function (e) { fail++; row(table, 'fail', '✕', r.name, e.message); });
      });
    });

    chain.then(function () {
      summary.innerHTML = fail === 0
        ? '<span class="ok">Все ' + pass + ' проверок прошли</span>'
        : '<span class="fail">Провалено: ' + fail + '</span> · <span class="ok">прошло: ' + pass + '</span>';
      document.title = (fail ? '✕ ' + fail : '✓ ' + pass) + ' — тесты SDM';
      window.__testResult = { pass: pass, fail: fail };
    });
  }

  function row(table, cls, mark, name, msg) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="st ' + cls + '">' + mark + '</td><td>' + name +
      '</td><td class="msg">' + (msg || '') + '</td>';
    table.appendChild(tr);
  }

  document.getElementById('rerun').addEventListener('click', run);
  run();
})();
</script>
</body>
