<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<title>Template smoke</title>
<link rel="stylesheet" href="../../packages/engine/tests/harness.css">
</head>
<body>
<h1>Template smoke</h1>
<p class="sub">Three checks that the template works as a starting point for a new brand:
it renders, it is clickable, it did not inherit foreign values.
<button id="rerun">Rerun</button></p>
<div id="summary">Running…</div>
<div id="out"></div>
<div id="stage"></div>

<script>
  history.replaceState(null, '', location.pathname +
    '?gallery=../../packages/engine/gallery.html&brand=../../brands/_template' + location.hash);
</script>
<script src="../../packages/engine/tests/harness.js"></script>
<script>
(function () {
  'use strict';
  function D() { return H.gallery().doc; }
  function G() { return H.gallery().win; }

  H.g('Template');

  H.t('button rendered in both panes', function () {
    ['mobile', 'desktop'].forEach(function (which) {
      var p = H.pane('buttons', which, '.t-btn');
      H.ok(p.el, 'no .t-btn in ' + which + ' pane');
      H.ok(H.px(H.css('buttons', which, '.t-btn', 'height')) > 0, 'zero height in ' + which);
    });
  });

  H.t('example is clickable', function () {
    var p = H.pane('buttons', 'mobile', '[data-pick]');
    H.ok(p.el, 'template has no data-pick — a new brand would copy this mistake');
  });

  H.t('template is neutral: no other brand names', function () {
    var text = (G().BRAND_MANIFEST.title + ' ' +
                JSON.stringify(G().BRAND_TOKENS) + ' ' +
                JSON.stringify(G().BRAND_SECTIONS.map(function (s) { return s.title; })));
    H.ok(!/sdm/i.test(text), 'template still references another brand');
  });

  H.g('Package — data');

  H.t('brand data is parsed as JSON, not executed', function () {
    /* That is the whole point: a storybook delivered as files must
       open without running foreign code. */
    var base = G().ENGINE_BRAND.source.base;
    var files = ['manifest.json', 'sections.json', 'token-map.json'];
    return Promise.all(files.map(function (f) {
      return fetch(base + f, { cache: 'no-store' }).then(function (r) {
        H.ok(r.ok, 'missing file ' + f);
        return r.text();
      }).then(function (text) {
        try { JSON.parse(text); }
        catch (e) { throw new Error(f + ' is not valid JSON: ' + e.message); }
      });
    }));
  });

  H.t('gallery did not load any scripts from brand', function () {
    var doc = D();
    var base = G().ENGINE_BRAND.source.base;
    var fromBrand = [].filter.call(doc.scripts, function (sc) {
      return sc.src && sc.src.indexOf(base) >= 0;
    }).map(function (sc) { return sc.src; });
    H.eq(fromBrand.length, 0, 'executed from brand: ' + fromBrand.join(', '));
  });

  H.run();
})();
</script>
</body>
</html>
